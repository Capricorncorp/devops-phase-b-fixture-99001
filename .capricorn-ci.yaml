version: 1
steps:
  - name: fixture-build
    run: test -f server.cjs && test -f blocked.cjs && printf 'G25_SAST_MUST_BLOCK_PUBLICATION_AND_CD\n'
    timeout: 30
securityGates:
  sast:
    rules: rules.yaml
    timeout: 600
  secrets:
    timeout: 600
  dast:
    image: node@sha256:9bef0ef1e268f60627da9ba7d7605e8831d5b56ad07487d24d1aa386336d1944
    command: node server.cjs
    port: 3000
    timeout: 600
image:
  name: whole-suite-proof-g25-block-20261017
  builder: dockerfile
  dockerfile: Dockerfile
  cache: true
deploy:
  provider: swarm
  target:
    serviceName: whole-suite-proof-g25-block-20261017
    replicas: 1
    ingressHost: whole-suite-proof-g25-block-20261017-2.apps.capricorncorp.com
    limitCpu: '0.25'
    limitMemory: 128m
    env:
      ACCEPTANCE_VERSION: g25-sast-must-block-20261017-v1
      WHOLE_SUITE_PROOF: g25-prepublication-security
