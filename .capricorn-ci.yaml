version: 1
library:
  actions:
    prepareProof:
      steps:
        - name: prepare-declared-output
          run: mkdir -p dist && printf '%s\n' 'Capricorncorp DevOps declared artifact proof 2026-10-17' > dist/proof.txt
          timeout: 30
    inspectProof:
      steps:
        - name: verify-reused-action
          run: test "$(cat dist/proof.txt)" = 'Capricorncorp DevOps declared artifact proof 2026-10-17' && tar -tzf dist/proof.tar.gz && printf '%s\n' 'G26 reusable action executed with G05 exact file bytes'
          timeout: 30
  jobs:
    makeBundle:
      steps:
        - uses: prepareProof
        - name: package-declared-output
          run: tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -czf dist/proof.tar.gz -C dist proof.txt
          timeout: 30
jobs:
  produce:
    template: makeBundle
  inspectFirst:
    needs: [produce]
    steps:
      - uses: inspectProof
  inspectSecond:
    needs: [inspectFirst]
    steps:
      - uses: inspectProof
artifacts:
  - kind: file
    name: delivery-proof.txt
    path: dist/proof.txt
  - kind: tarball
    name: delivery-proof.tar.gz
    path: dist/proof.tar.gz
image:
  name: g05-g21-g26-native-proof-20261017
  builder: dockerfile
  dockerfile: Dockerfile
  cache: true
